on:
  pull_request:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-

      # the LLVM that ships with the windows runner (20.x) is too old for the 26.40 headers, it
      # fails with `invalid application of 'sizeof' to an incomplete type` while building the
      # LeviLamina package. 23 matches the toolchain ModAPI is developed against (LeviLamina's own
      # CI pins 22).
      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Update Repo
        run: xmake repo -u

      - name: Update Project
        run: xmake f -a x64 -m release -p windows -y

      - name: Build Project
        run: xmake -w -y

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64-${{ github.sha }}
          path: |
            bin/